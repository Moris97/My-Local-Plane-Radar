<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>My Local Plane Radar</title>
<link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="map"></div>

<div id="panel-overlay" class="hidden"></div>
<section id="panel" class="hidden" aria-hidden="true">
  <header id="panel-header">
    <h2 id="panel-title"></h2>
    <button type="button" id="panel-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="5" y1="5" x2="19" y2="19"/>
        <line x1="19" y1="5" x2="5" y2="19"/>
      </svg>
    </button>
  </header>
  <div id="panel-content"></div>
</section>

<nav id="bottom-bar">
  <button type="button" class="mlpr-bar-btn" data-panel="list" aria-label="List">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <rect x="4" y="5" width="16" height="2.2" rx="1"/>
      <rect x="4" y="10.9" width="16" height="2.2" rx="1"/>
      <rect x="4" y="16.8" width="16" height="2.2" rx="1"/>
    </svg>
  </button>
  <button type="button" class="mlpr-bar-btn" data-panel="stats" aria-label="Stats">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <rect x="4" y="12" width="4" height="8"/>
      <rect x="10" y="7" width="4" height="13"/>
      <rect x="16" y="3" width="4" height="17"/>
    </svg>
  </button>
  <button type="button" class="mlpr-bar-btn" data-panel="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="6" y1="4" x2="6" y2="20"/>
      <circle cx="6" cy="9" r="2.3" fill="#05070a"/>
      <line x1="12" y1="4" x2="12" y2="20"/>
      <circle cx="12" cy="15" r="2.3" fill="#05070a"/>
      <line x1="18" y1="4" x2="18" y2="20"/>
      <circle cx="18" cy="7" r="2.3" fill="#05070a"/>
    </svg>
  </button>
</nav>

<script src="/vendor/maplibre-gl/maplibre-gl.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
